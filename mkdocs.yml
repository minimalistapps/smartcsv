site_name: Smart CSV Docs
site_url: https://minimalistapps.github.io/smartcsv
theme:
  name: material
  # Colours come from the app's design tokens, in stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.integrate
    - toc.follow
    - content.code.annotate
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: material/format-quote-open

copyright: Copyright &copy; 2023&ndash;2026 Minimalist Apps

extra_css:
  - stylesheets/extra.css
  
markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      
nav:
  - Smart CSV: index.md
  - Getting started:
      - Basics: basics.md
      - Import options: import-options.md
      - Editing: editing.md
  - Find data:
      - Filter: filter.md
      - Sql query: sql-query.md
      - AI assistant: ai-assistant.md
  - Columns:
      - Show/hide, freeze columns: show-hide-freeze.md
      - Align content: align-column.md
      - Column types: column-types.md
      - Show as column image: column-to-image.md
  - Export:
      - Export pdf: export-pdf.md
      - Generate chart: generate-chart.md
  - Settings & FAQ:
      - Customization: customization.md
      - FAQ: faq.md
